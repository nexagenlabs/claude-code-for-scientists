# Netlify configuration for science.nexagenlabs.com
#
# The site is generated by site/build_site.py from the repository itself,
# so it cannot drift from the builds it describes. Netlify runs that
# script on every push and publishes the result.

[build]
  command = "python3 site/build_site.py"
  publish = "site/dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# The generator also writes site/dist/_redirects, which Netlify reads.
# These headers are the only thing it cannot express there.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'"
